name: quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uv python install 3.12.11
      - run: uv sync --locked
      - run: uv run ruff check app tests benchmarks
      - run: uv run python -m compileall -q app tests benchmarks
      - run: uv run coverage run --source=app,benchmarks -m unittest discover -s tests -v
      - run: uv run coverage report --fail-under=55
      - run: uv run python -m app.core.runner --max-time 120 --artifact-dir /tmp/baseline-one
      - run: uv run python -m app.core.runner --max-time 120 --artifact-dir /tmp/baseline-two
      - run: cmp /tmp/baseline-one/baseline.json /tmp/baseline-two/baseline.json
      - run: uv run python -m benchmarks.benchmark_core --runs 1 --max-events 200
