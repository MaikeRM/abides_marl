[project]
name = "abides_marl"
version = "0.2.0"
description = "ABIDES-inspired multi-agent market simulator with a DearPyGui dashboard."
readme = "README.md"
requires-python = "==3.12.11"
dependencies = [
    "plotext>=5.3.2",
    "rich>=14.3.2",
    "textual>=7.5.0",
    "textual-plotext>=1.0.1",
    "PyYAML>=6.0.1",
    "urllib3>=2.6.3",
    "pandas>=3.0.0",
    "dearpygui>=1.11.1",
    "gymnasium>=1.0.0",
    "numpy>=2.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E4", "E7", "E9", "F"]
lint.ignore = ["E501"]
